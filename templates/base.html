<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AdClick Insights{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17233c;
      --muted: #63708a;
      --paper: #f4f7fc;
      --card: #fff;
      --blue: #3459d1;
      --line: #e3e9f3;
      --green: #147d58;
      --red: #b53d4b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
    .shell { min-height: 100vh; }
    header { background: #fff; border-bottom: 1px solid var(--line); }
    .topbar { max-width: 1120px; margin: auto; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { color: var(--ink); font-size: 18px; font-weight: 750; text-decoration: none; }
    nav { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    nav a, .logout { color: var(--muted); text-decoration: none; padding: 8px 12px; border-radius: 8px; }
    nav a:hover, nav a.active { background: #edf1ff; color: var(--blue); }
    .logout { border: 0; background: transparent; font: inherit; cursor: pointer; }
    .logout:hover { color: var(--red); }
    .content { width: min(100% - 36px, 1060px); margin: 38px auto; }
    .eyebrow { color: var(--blue); font-size: 12px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 6px 0 8px; font-size: clamp(28px, 4vw, 38px); line-height: 1.2; }
    h2 { margin-top: 0; }
    .muted { color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin: 26px 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; box-shadow: 0 5px 20px rgb(28 48 87 / 4%); }
    .metric { font-size: 28px; font-weight: 750; margin: 8px 0 2px; }
    .label { color: var(--muted); font-size: 14px; }
    .button { display: inline-flex; justify-content: center; align-items: center; border: 0; border-radius: 9px; background: var(--blue); color: white; font: inherit; font-weight: 650; padding: 11px 16px; text-decoration: none; cursor: pointer; }
    .button:hover { background: #2749b8; }
    .button.secondary { background: #edf1ff; color: var(--blue); }
    .button.secondary:hover { background: #e1e8ff; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    label { display: block; font-size: 14px; font-weight: 650; margin-bottom: 6px; }
    input, select { width: 100%; border: 1px solid #cfd8e7; border-radius: 8px; background: #fff; color: var(--ink); padding: 11px 12px; font: inherit; }
    input:focus, select:focus { outline: 3px solid #dce4ff; border-color: var(--blue); }
    .form-actions { margin-top: 20px; }
    .notice { border-radius: 10px; padding: 13px 16px; margin: 18px 0; background: #fff7e5; color: #72530d; }
    .error { background: #fff0f1; color: var(--red); }
    .result { border-left: 4px solid var(--green); }
    .result.no-click { border-left-color: var(--blue); }
    .probability { font-size: 32px; font-weight: 750; margin: 2px 0; }
    .login-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top left, #e2e9ff, transparent 40%), var(--paper); }
    .login-card { width: min(100%, 430px); }
    .login-card .form-actions .button { width: 100%; }
    .demo-credentials { background: #f1f4fb; border-radius: 9px; padding: 12px 14px; font-size: 14px; }
    footer { color: var(--muted); text-align: center; padding: 20px; font-size: 13px; }
    @media (max-width: 700px) {
      .topbar { align-items: flex-start; flex-direction: column; padding: 14px 18px; }
      .grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .content { margin: 26px auto; }
    }
  </style>
</head>
<body>
  {% if session.get("logged_in") %}
  <div class="shell">
    <header>
      <div class="topbar">
        <a class="brand" href="{{ url_for('dashboard') }}">AdClick Insights</a>
        <nav aria-label="Main navigation">
          <a class="{% if request.endpoint == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">Dashboard</a>
          <a class="{% if request.endpoint == 'predict' %}active{% endif %}" href="{{ url_for('predict') }}">Predict</a>
          <a class="{% if request.endpoint == 'about' %}active{% endif %}" href="{{ url_for('about') }}">Model info</a>
          <form method="post" action="{{ url_for('logout') }}">
            <button class="logout" type="submit">Log out</button>
          </form>
        </nav>
      </div>
    </header>
    <main class="content">{% block content %}{% endblock %}</main>
    <footer>AdClick Insights · Model predictions are estimates, not guarantees.</footer>
  </div>
  {% else %}
    {% block public_content %}{% endblock %}
  {% endif %}
</body>
</html>
